services:
  postgres:
    image: postgres:16-alpine
    container_name: toolshare-postgres
    environment:
      POSTGRES_DB: toolshare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d toolshare"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: toolshare-api
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "--filter", "toolshare-api", "start:dev"]

volumes:
  postgres-data:

